name: Image source contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-source-contracts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install source inspection tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck jq ripgrep make zstd zip unzip e2fsprogs
      - name: Validate source without compilation or RPM generation
        shell: bash
        run: |
          set -Eeuo pipefail
          guard=$(mktemp -d)
          trap 'rm -rf -- "$guard"' EXIT
          cat > "$guard/refuse-build" <<'GUARD'
          #!/bin/sh
          echo "Native compilation and RPM generation belong in COPR: ${0##*/}" >&2
          exit 97
          GUARD
          chmod +x "$guard/refuse-build"
          for tool in gcc g++ cc c++ clang clang++ as ld rpmbuild; do ln -s refuse-build "$guard/$tool"; done
          export PATH="$guard:$PATH"
          for script in src/public/*.sh packaging/*.sh; do bash -n "$script"; done
          shellcheck --exclude=SC2015 src/public/*.sh packaging/*.sh tests/public-build-contract.sh tests/public-channel-contract.sh
          bash tests/public-build-contract.sh
          shellcheck tests/distribution-routing.sh
          bash tests/distribution-routing.sh
          shellcheck src/ubuntu/configure-root.sh tests/ubuntu-root-contract.sh
          bash tests/ubuntu-root-contract.sh
          bash tests/public-channel-contract.sh
          shellcheck src/public/languages.sh tests/languages.sh
          bash tests/languages.sh
          shellcheck tests/language-repair.sh
          bash tests/language-repair.sh
          shellcheck tests/serialized-languages.sh
          bash tests/serialized-languages.sh
          shellcheck src/public/first-boot-policy.sh tests/first-boot-policy.sh
          bash tests/first-boot-policy.sh
          bash tests/repository-kernel-plan.sh
          shellcheck src/public/cohort.sh tests/repository-kernel-identity.sh
          bash tests/repository-kernel-identity.sh
          bash tests/public-worker-snapshot.sh docker
          shellcheck --exclude=SC2015 src/audit/check-target-payload.sh tests/payload-traversal.sh
          bash tests/payload-traversal.sh
          shellcheck src/public/cutefish-icons-proof.sh tests/cutefish-passive-icons.sh
          bash tests/cutefish-passive-icons.sh
          bash tests/original-kde-payload.sh
          shellcheck src/public/release-layout.sh scripts/publish-image-release.sh scripts/merge-desktop-deliveries.sh scripts/reuse-validated-desktop.sh tests/release-layout.sh
          bash tests/release-layout.sh
          shellcheck src/public/shared-core.sh src/public/desktop-repository.sh src/public/desktop-setup.sh src/public/nextkde-session.sh scripts/hosted-core.sh scripts/hosted-image.sh tests/shared-core.sh
          bash tests/shared-core.sh
          shellcheck src/public/root-kernel-signatures.sh tests/root-kernel-signatures.sh
          bash tests/root-kernel-signatures.sh
          shellcheck scripts/reuse-verified-core.sh tests/reuse-core.sh
          bash tests/reuse-core.sh
          shellcheck src/public/desktop-isolation.sh tests/desktop-isolation.sh
          bash tests/desktop-isolation.sh
          echo 'Native helper builds and file fixtures run in the uke-image-tools COPR build.' >> "$GITHUB_STEP_SUMMARY"
